name: Déploiement Azure via OIDC

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: demo
    env:
      TF_VAR_subscription: ${{ secrets.subscription }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Vérifier la session Azure
        run: az account show
